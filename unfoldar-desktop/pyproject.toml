[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "unfoldar-desktop"
version = "1.0.0"
description = "LiDAR-first room scan colorization, registration, meshing, and texturing desktop application"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3",
  "opencv-python>=4.10,<6",
  "open3d>=0.19,<0.20",
  "plyfile>=1.1,<2",
  "scipy>=1.14,<2",
  "PySide6-Essentials>=6.8,<7",
  "pyvista>=0.46,<0.49",
  "pyvistaqt>=0.11,<0.14",
  "vtk>=9.3,<10",
  "xatlas>=0.0.11,<0.1",
]

[project.scripts]
unfoldar = "unfoldar.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unfoldar"]

